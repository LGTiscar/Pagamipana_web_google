  --pmp-ink-1:#fafafa;
  --pmp-ink-2:#d4d4d8;
  --pmp-ink-3:#a1a1aa;
  --pmp-accent:#60a5fa;
  --pmp-accent-wash:#1e3a8a;
}
html,body{margin:0;height:100%;background:var(--pmp-surface);color:var(--pmp-ink-1)}
body{font-family:var(--pmp-font);-webkit-font-smoothing:antialiased}

/* The one stylesheet the map needs: the dash march along the active flow edge.
   -18px is one full dasharray period (10 8), so the loop is seamless.
   Import once, anywhere the map is mounted. */
@keyframes am-dash {
  to {
    stroke-dashoffset: -18px;
  }
}

@media (prefers-reduced-motion: reduce) {
  [style*="am-dash"] {
    animation: none !important;
  }
}
